# Frame-cost sweep: fixed budget=300, varying frame_cost only. Base
# parameters copied from config_train.yaml (the source of truth) - frame_cost
# deliberately NOT set here as a base value, since it's the swept parameter
# (would otherwise conflict with the sweep: section below).
env_id: AdaptiveFPS-v0
run_file: TAL_maps
map_name: f1_aut
model_run_name: fast_Std_Std_TAL_f1_aut_6_5_0

budget: 150

total_timesteps: 15_000_000
num_envs: 16
num_steps: 512
num_minibatches: 4
update_epochs: 4

learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.98
clip_coef: 0.2
ent_coef: 0.05
vf_coef: 0.5
max_grad_norm: 0.5

seed: 1
cuda: false
async_envs: true

sweep:
  frame_cost: [0.0, 0.03, 0.05, 0.075, 0.1]
